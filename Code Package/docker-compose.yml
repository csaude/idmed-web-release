version: '3.3'
services:
  db:
    image: hub.csaude.org.mz/idmed/postgres:15.6
    shm_size: 2g
    ports:
      - "9876:5432"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - "./pgmaster-data:/var/lib/postgresql/data"
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    restart: always

  psql: &psql
    image: hub.csaude.org.mz/idmed/postgres:15.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TARGET_DB_NAME: ${TARGET_DB_NAME}
      TARGET_DB_USER: ${TARGET_DB_USER}
      TARGET_DB_PASS: ${TARGET_DB_PASS}
      TARGET_DB_PORT: ${TARGET_DB_PORT}
      TARGET_DB_HOST: ${TARGET_DB_HOST}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
       - "./csaude-idmed-current/app/backend/scripts/:/usr/local/idmed/scripts/"
    command: bash

  initscript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Master create main Database ===
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -c "create database idmed ;"

  removelastdbscript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Master create main Database ===
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -c "drop database idmed_backup_1_4_0;"

  initializationscript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Master Initialization script ===
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -d ${POSTGRES_DB} < /usr/local/idmed/scripts/schemaProvincialServer_1.6.0.sql

  initdbscript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Master DB Update script ===
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -d ${POSTGRES_DB} < /usr/local/idmed/scripts/InitiDMEDdb.sql

  updatescript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Master DB Update script ===
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -d ${POSTGRES_DB} < /usr/local/idmed/scripts/updateSchemaProvincialServer_1.6.0.sql
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -d ${POSTGRES_DB} < /usr/local/idmed/scripts/UpdateiDMEDdb.sql

  updateidartmigrationserver:
     <<: *psql
     command:
       - bash
       - -c
       - |
         echo === Master create data base IDART ===
         psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -d ${POSTGRES_DB} < /usr/local/idmed/scripts/MigrationServerConfig.sql

  initbucardoscript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Master create user replication and bucardo ===
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -c "create user bucardo with password 'bucardo' SUPERUSER ;"
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -c "drop database bucardo;"
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -c "create database bucardo OWNER bucardo ;"

  bucardosyncdatascript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === DB Send Data to Provicial Server script ===
        PGPASSWORD=${TARGET_DB_PASS} psql -U ${TARGET_DB_USER} -h ${TARGET_DB_HOST} -p ${TARGET_DB_PORT} -d ${TARGET_DB_NAME} < /usr/local/idmed/scripts/idmed_disable.sql
        PGPASSWORD=${TARGET_DB_PASS} psql -U ${TARGET_DB_USER} -h ${TARGET_DB_HOST} -p ${TARGET_DB_PORT} -d ${TARGET_DB_NAME} < /usr/local/idmed/scripts/idmedBackupBucardo.sql
        PGPASSWORD=${TARGET_DB_PASS} psql -U ${TARGET_DB_USER} -h ${TARGET_DB_HOST} -p ${TARGET_DB_PORT} -d ${TARGET_DB_NAME} < /usr/local/idmed/scripts/idmed_enable.sql

  initlogicalreplicationscript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Master create SUBSCRIPTION ===
        sh /usr/local/idmed/scripts/CreateSubscriberScript.sh

  initbackupdatabasescript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Backup create Database ===
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -c "create database idmedbackup ;"
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -d idmedbackup < /usr/local/idmed/scripts/schemaProvincialServer_1.6.0.sql

  backupscript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Backup DB script ===
        sh /usr/local/idmed/scripts/backup.sh
        grep -v "SELECT pg_catalog.setval" /usr/local/idmed/scripts/idmedBackup.sql > /usr/local/idmed/scripts/idmedBackupBucardo.sql

  restorescript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Backup DB Restore script ===
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -d idmedbackup < /usr/local/idmed/scripts/idmed_disable.sql
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -d idmedbackup < /usr/local/idmed/scripts/idmedBackup.sql
        psql -U ${POSTGRES_USER} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -d idmedbackup < /usr/local/idmed/scripts/idmed_enable.sql

  renamedatabasescript:
    <<: *psql
    command:
      - bash
      - -c
      - |
        echo === Rename idmedbackup to idmed ===
        psql -U postgres -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -c "ALTER DATABASE idmed RENAME TO idmed_backup_1_5_0 ;"
        psql -U postgres -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -c "ALTER DATABASE idmedbackup RENAME TO idmed ;"

  backendserver:
    image: hub.csaude.org.mz/idmed/idmed_backend:1.5.0
    ports:
      - "3000:8884"
    links:
       - db
    environment:
       DATABASE_HOST: ${POSTGRES_HOST}
       DB_USER: ${DB_USER}
       DB_PASS: ${DB_PASS}
       DB_URL:  ${DB_URL}
    depends_on:
       - db
    restart: always
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
      - "/var/log/idmed/:/var/log/idmed_logs"
      - "./csaude-idmed-current/app/backend/scripts:/backend/scripts"
      - "./csaude-idmed-current/app/backend/build/idmed-backend.war:/usr/src/idmed/idmed-backend.war"
    command:
      - /bin/bash
      - -c
      - chmod 777 /usr/src/idmed/idmed-backend.war && java -jar /usr/src/idmed/idmed-backend.war

  frontendserver:
    image: hub.csaude.org.mz/idmed/idmed_frontend:1.5.0
    ports:
      - "5000:80"
    depends_on:
      - backendserver
    restart: always
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
      - "./csaude-idmed-current/app/frontend/spa:/usr/share/nginx/html"
      - "./csaude-idmed-current/app/frontend/nginx_conf.conf:/etc/nginx/conf.d/default.conf"
    command:
        - sh
        - -c
        - |
          echo === Check weather BackEnd is up running ===
          while [[ "$$(curl --connect-timeout 2 -s -o /dev/null -w ''%{http_code}'' backendserver:8884/api/province)" != "200" ]];
          do
            echo BackEnd indisponivel - aguarde ...;
            sleep 5;
          done;
          echo BackEnd DISPONIVEL - Avante!!!!;
          nginx -g 'daemon off;'

  bucardo:
    image: hub.csaude.org.mz/idmed/idmed_bucardo:1.5.0
    stdin_open: true
    tty: true
    environment:
       DATABASE_HOST:  ${POSTGRES_HOST}
       TARGET_DB_NAME: ${TARGET_DB_NAME}
       TARGET_DB_USER: ${TARGET_DB_USER}
       TARGET_DB_PASS: ${TARGET_DB_PASS}
       TARGET_DB_PORT: ${TARGET_DB_PORT}
       TARGET_DB_HOST: ${TARGET_DB_HOST}
       SOURCE_DB_NAME: ${SOURCE_DB_NAME}
       SOURCE_DB_USER: ${SOURCE_DB_USER}
       SOURCE_DB_PASS: ${SOURCE_DB_PASS}
    volumes:
      - "./csaude-idmed-current/app/bucardo/example:/media/bucardo"
      - "./csaude-idmed-current/app/bucardo/lib/customcode.filter.us.pl:/customcode.filter.us.pl"
      - "./csaude-idmed-current/app/bucardo/lib/entrypoint.sh:/entrypoint.sh"
      - "./csaude-idmed-current/app/bucardo/lib/sub_entrypoint.sh:/sub_entrypoint.sh"
      - "./csaude-idmed-current/.env:/.env"
      - "./csaude-idmed-current/app/bucardo/etc/bucardorc:/etc/bucardorc"
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    command:
      - /bin/bash
      - -c
      - mkdir -p /var/run/bucardo && chown postgres /var/run/bucardo && usermod -aG bucardo postgres && sh /entrypoint.sh
    depends_on:
      - db

  pgbackups:
    image: hub.csaude.org.mz/idmed/idmed-postgres-backup-local:1.5.0
    restart: always
    volumes:
      - /var/opt/idmed/pgbackups:/backups
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    links:
      - db
    depends_on:
      - db
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_EXTRA_OPTS=${POSTGRES_EXTRA_OPTS}
      - SCHEDULE=${SCHEDULE}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS}
      - BACKUP_KEEP_WEEKS=${BACKUP_KEEP_WEEKS}
      - BACKUP_KEEP_MONTHS=${BACKUP_KEEP_MONTHS}
      - HEALTHCHECK_PORT=${HEALTHCHECK_PORT}
